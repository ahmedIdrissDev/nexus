interface:
  display_name: "Nexus UI"
  short_description: "Compose purposeful UIs with Nexus components"
  default_prompt: "Use $nexus. For non-trivial UI, read references/ui-composition.md, references/component-registry.md, and references/layout-patterns.md; plan the product information architecture first, then reuse Nexus components and styles. Avoid generic dashboards, excessive cards, invented content, unnecessary icons, duplicate components, and custom styling."

policy:
  allow_implicit_invocation: true
