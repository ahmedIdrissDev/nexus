interface:
  display_name: "Nexus UI"
  short_description: "Compose purposeful UIs with Nexus components"
  default_prompt: "Use $nexus and read references/ui-composition.md before building non-trivial UI. Plan the product-focused information architecture first, then compose with only the predefined Nexus Tailwind CSS styles and TSX components. Avoid generic dashboards, excessive cards, invented content, unnecessary icons, and custom styling."

policy:
  allow_implicit_invocation: true
